 let strength=(1-smooth(.070,.098,Math.abs(r.y-s.ey)))*smooth(0,.018,s.y0-r.y);if(r.cuff)strength=0;for(let l=0;l<n;l++)filtered[l]*=strength;
 states.push({r,C,X,Z,fade,rs,off:filtered});
 }
 for(let it=0;it<2;it++){let copy=states.map(s=>s.off.slice());for(let i=1;i<states.length-1;i++){if(states[i].r.cuff)continue;for(let l=0;l<n;l++)states[i].off[l]=.5*copy[i][l]+.25*(copy[i-1][l]+copy[i+1][l]);}}
 for(const st of states){const {r,C,X,Z,fade,rs,off}=st;for(let l=0;l<n;l++){let k=(r.start+l)*3,[x,z,rad]=rs[l],scale=rad>1e-8?1+off[l]/rad:1;x*=scale;z*=scale;let v=C.map((v,k)=>v+x*X[k]+z*Z[k]+delta[l][k]*fade);p.set(v,k);}}
 }return p;}

function poseArrays(a,g,bodyP){if(g!==a.shirt.mesh)return basePoseArrays(a,g);if(a.joints.every(j=>!j.side&&!j.front))return [g.rest.slice(),g.restNorm.slice()];bodyP=bodyP||basePoseArrays(a,a.body.mesh)[0];let p;if(a.joints.some(j=>j.kind==='shoulder'&&(j.side||j.front))){p=clothInitial(a,g,bodyP);smoothCloth(p,g,4);fitCloth(a,g,p,bodyP);fitRays(a,g,p,bodyP);}else p=g.rest.slice();longPose(a,g,p,bodyP);return [p,meshNormals(p,g.faces)];}
function selectJoint(j){selected=j;for(let a of actors)for(let k of a.joints)k.button.classList.toggle('active',k===j);posePanel.hidden=false;document.getElementById('jointName').textContent=(j.kind==='shoulder'?'어깨':'팔꿈치');sideAngle.value=j.side;frontAngle.value=j.front;sideAngle.disabled=j.kind==='elbow';}
function deform(a){const bodyPose=poseArrays(a,a.body.mesh);for(let g of [a.body.mesh,a.shirt.mesh]){const [p,n]=g===a.body.mesh?bodyPose:poseArrays(a,g,bodyPose[0]);for(let [buf,arr] of [[g.pos,p],[g.norm,n]]){gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,renderPoseAttribute(g,arr),gl.DYNAMIC_DRAW);}if(g===a.shirt.mesh)poseButtons(a,p);}requestRender();}
function changePose(){if(!selected)return;selected.side=+sideAngle.value;selected.front=+frontAngle.value;deform(selected.actor);}
sideAngle.onchange=frontAngle.onchange=changePose;document.getElementById('resetPose').onclick=()=>{for(let a of actors){for(let j of a.joints){j.side=j.front=0;}deform(a);}if(selected)selectJoint(selected);};
function projectJoints(a,vp,rect,w,h){for(let j of a.joints){let p=j.parent?jointTransform(j.p,j.parent):j.p;let q=[0,0,0,0];for(let k=0;k<4;k++)q[k]=vp[k]*p[0]+vp[k+4]*p[1]+vp[k+8]*p[2]+vp[k+12];let x=rect[0]+(q[0]/q[3]+1)*rect[2]/2,y=rect[1]+(q[1]/q[3]+1)*rect[3]/2;j.button.style.left=x/w*innerWidth+'px';j.button.style.top=(1-y/h)*innerHeight+'px';j.button.hidden=q[3]<=0||Math.abs(q[0]/q[3])>1||Math.abs(q[1]/q[3])>1;}}

function render(){
 if(!gl||!program)return;
 const dpr=Math.min(devicePixelRatio||1,2),scale=Math.min(dpr,2048/Math.max(1,innerWidth),2048/Math.max(1,innerHeight));
 const w=Math.max(2,Math.round(innerWidth*scale)),h=Math.max(2,Math.round(innerHeight*scale));
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
 gl.disable(gl.SCISSOR_TEST);gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.useProgram(program);gl.uniform3fv(loc.light,Float32Array.from(rgb('#f3d0bb')));gl.uniform3fv(loc.shadow,Float32Array.from(rgb('#dcad99')));gl.uniform1f(loc.brightness,1.0);
 gl.enable(gl.SCISSOR_TEST);
 const rects=panels(w,h);
 for(let i=0;i<actors.length;i++){
  const a=actors[i],rect=rects[i];gl.viewport(...rect);gl.scissor(...rect);gl.clear(gl.DEPTH_BUFFER_BIT);
  const aspect=rect[2]/rect[3],fov=36*Math.PI/180;
  const center=[0,1.24,.045];
  const d=Math.max(1.04,.64/Math.max(aspect,.18)/Math.tan(fov/2)/2)/zoom;
  const eye=[center[0]+Math.sin(yaw)*d*Math.cos(pitch),center[1]+Math.sin(pitch)*d,center[2]+Math.cos(yaw)*d*Math.cos(pitch)];
  const view=lookAt(eye,center),vp=mul(perspective(fov,aspect,.008,30),view);gl.uniformMatrix3fv(loc.viewNormal,false,Float32Array.of(view[0],view[1],view[2],view[4],view[5],view[6],view[8],view[9],view[10]));gl.uniform3fv(loc.eye,eye);gl.uniform2f(loc.elbow,Math.sin(Math.min(120,Math.abs(a.joints[1].front))*Math.PI/240),Math.sin(Math.min(120,Math.abs(a.joints[3].front))*Math.PI/240));
  projectJoints(a,vp,rect,w,h);draw(a.body.mesh,vp);draw(a.shirt.mesh,vp);draw(a.buttons.mesh,vp);draw(a.collar.band,vp);draw(a.collar.outer,vp);
 }
 gl.disable(gl.SCISSOR_TEST);
}
async function start(){
 if(!gl||!program||!uintExt){if(gl&&!uintExt)status.textContent='이 기기는 32비트 메시를 지원하지 않아';return;}
 try{for(const sex of ['male','female']){const body=await decodeData('data_'+sex);const collar=collarPieces(sex,body);const shirt=shirtPieces(sex);const actor={sex,body,collar,shirt};initPose(actor);fabricDetail(actor);initButtons(actor);const g=actor.shirt.mesh;const patches=JSON.parse(document.getElementById('shirt_'+sex).textContent).renderPatches||[];compactRenderMesh(g,g.faces,g.renderColors,patches,g.detailData);delete g.renderColors;actors.push(actor);}
 render();status.hidden=true;window.__sernbeldViewer={actors,poseArrays,checks:actors.map(a=>({collar:a.collar.checks,shirt:a.shirt.checks})),get camera(){return {yaw,pitch,zoom}}};document.documentElement.dataset.loaded='true';
 }catch(e){console.error(e);status.textContent='모델 읽기 실패: '+e.message;}
}
start();
</script></body></html>
