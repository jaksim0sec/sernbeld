name: Sernbeld refactor regression
on:
  push:
    branches: [refactor/structure-phase1]
  workflow_dispatch:
jobs:
  webgl-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct original game bundle byte-for-byte
        run: |
          node tools/build-game.mjs --check
          node --check game.js
      - name: Prepare main baseline
        run: git worktree add --detach /tmp/sernbeld-main origin/main
      - name: Validate original HTML, CSS, assets and unchanged JavaScript
        run: node tests/structure-check.mjs
      - name: Install headless browser tooling
        run: |
          npm install --no-save --no-package-lock playwright pngjs three
          npx playwright install chromium
      - name: Validate foundation entity, event and inventory behavior
        run: node tests/foundation.mjs
      - name: Validate detailed item durability
        run: node tests/durable-items.mjs
      - name: Validate skill compiler and custom skill persistence
        run: |
          node tests/skill-engine.mjs
          node tests/skill-library.mjs
          node tests/skill-runner.mjs
      - name: Validate region activation and compact state restoration
        run: node tests/region-lifecycle.mjs
      - name: Validate wildlife removal and saved quest compatibility
        run: node tests/wildlife-removal.mjs
      - name: Validate registered female mesh, rig and standard skin
        run: node tests/character-assets.mjs
      - name: Render female model with standard skin in Chromium
        run: node tests/character-webgl.mjs
      - name: Validate Kael routes, terrain contact and NPC navigation in Chromium
        run: node tests/kael-roads.mjs
      - name: Verify player avatar, resident face profiles, sword rig and 3P camera
        run: node tests/character-runtime-browser.mjs
      - name: Verify character studio rigged GLB import and local persistence
        run: node tests/character-studio-import-browser.mjs
      - name: Compare main and branch in WebGL Chromium
        run: node tests/webgl-smoke.mjs
      - name: Verify optional custom skill save in browser
        run: node tests/custom-skills-browser.mjs
      - name: Verify emulated mobile touch, map, inventory and SVG rendering
        run: node tests/mobile-regression.mjs
      - name: Verify PWA offline install, startup and fresh resource loading
        run: node tests/pwa-offline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgl-regression-captures
          path: test-results/
          if-no-files-found: ignore
