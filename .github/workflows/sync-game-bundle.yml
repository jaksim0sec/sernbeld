name: Sync generated game bundle
on:
  push:
    branches: [main]
    paths:
      - 'src/gameplay/gameplay.part.js'
      - 'src/render/world-render.part.js'
      - 'src/entities/character/clothing/**'
      - 'src/entities/character/studio-model.js'
      - 'src/entities/character/studio-geometry.js'
      - 'src/entities/character/attention-pose.js'
      - 'assets/models/characters/**'
      - 'assets/models/clothing/shirt-v1/**'
      - 'assets/models/clothing/pants-v1/**'
      - 'tools/bake-garments.mjs'
      - '.github/workflows/sync-game-bundle.yml'
permissions:
  contents: write
concurrency:
  group: sync-game-bundle-main
  cancel-in-progress: true
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Include latest source revisions
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Reassemble and verify runtime
        run: |
          node tools/build-game.mjs
          node tools/bake-garments.mjs
          node --check game.js
          node tools/build-game.mjs --check
          node tests/foundation.mjs
          node tests/startup-runtime.mjs
      - name: Commit generated bundle
        run: |
          git add game.js assets/models/clothing/runtime-bindings-v1.json.gz
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: sync game bundle and prebaked garment bindings'
          git push origin HEAD:main
