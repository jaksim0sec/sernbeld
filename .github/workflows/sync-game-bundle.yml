name: Sync generated game bundle
on:
  push:
    branches: [main]
    paths:
      - 'src/gameplay/gameplay.part.js'
      - 'src/render/world-render.part.js'
      - '.github/workflows/sync-game-bundle.yml'
permissions:
  contents: write
concurrency:
  group: sync-game-bundle-main
  cancel-in-progress: true
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Include latest source revisions
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Reassemble and verify runtime
        run: |
          node tools/build-game.mjs
          node --check game.js
          node tools/build-game.mjs --check
          node tests/foundation.mjs
      - name: Commit generated bundle
        run: |
          if git diff --quiet -- game.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js
          git commit -m 'build: sync game.js with movement sources'
          git push origin HEAD:main
