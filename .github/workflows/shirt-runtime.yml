name: Shirt runtime
on:
  push:
    branches: [main]
    paths:
      - 'assets/models/clothing/shirt-v1/**'
      - 'assets/models/clothing/pants-v1/**'
      - 'src/entities/character/clothing/**'
      - 'src/entities/character/studio-model.js'
      - 'src/entities/character/studio-source.js'
      - 'tests/shirt-runtime.mjs'
      - 'tests/pants-runtime.mjs'
      - '.github/workflows/shirt-runtime.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/shirt-reference.mjs
      - run: node tests/shirt-runtime.mjs
      - run: node tests/pants-runtime.mjs
      - run: node tests/studio-model.mjs
