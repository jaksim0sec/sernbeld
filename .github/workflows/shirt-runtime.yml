name: Shirt runtime
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/shirt-reference.mjs
      - run: node tests/shirt-runtime.mjs
      - run: node tests/garment-alignment.mjs
      - run: node tests/pants-runtime.mjs
      - run: node tests/studio-model.mjs
