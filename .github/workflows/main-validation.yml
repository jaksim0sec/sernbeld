name: Main validation and Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sernbeld-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Physics registry and live wiring contracts
        id: physics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          result=0
          for name in world-collision world-collision-legacy world-collision-surfaces world-collision-runtime; do
            state=success
            node "tests/$name.mjs" > /tmp/physics-single.log 2>&1 || { state=failure; result=1; }
            cat /tmp/physics-single.log
            if [ "$state" = failure ] && [ "${{ github.event_name }}" = push ]; then
              reason="$(grep -m1 -E 'AssertionError|TypeError|ReferenceError|SyntaxError|Error:' /tmp/physics-single.log || true)"
              reason="$(printf '%s' "$reason" | tr -cd '[:alnum:] ._:-' | cut -c1-90)"
              jq -n --arg context "physics/error-$name: $reason" '{state:"failure",context:$context,description:"Inspect workflow job logs for full details"}' > /tmp/physics-error-status.json
              curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" --data-binary @/tmp/physics-error-status.json "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"
            fi
            if [ "${{ github.event_name }}" = push ]; then
              jq -n --arg state "$state" --arg context "physics/test-$name" '{state:$state,context:$context,description:"Direct Node T1 regression"}' > /tmp/physics-single-status.json
              curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" --data-binary @/tmp/physics-single-status.json "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"
            fi
          done
          exit "$result"
      - name: Report direct physics contract result
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ steps.physics.outcome }}
        run: |
          state=failure
          [ "$RESULT" = success ] && state=success
          jq -n --arg state "$state" '{state:$state,context:"physics/direct-t1",description:"T1 collision registration and surface Node regression"}' > /tmp/physics-status.json
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" --data-binary @/tmp/physics-status.json "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"
      - name: Physics and real-world Node regression
        id: physicsworld
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          result=0
          for name in player-physics world-performance world-playability; do
            state=success
            if [ "$name" = world-playability ]; then
              node "tests/$name.mjs" --no-browser > /tmp/world-single.log 2>&1 || { state=failure; result=1; }
            else
              node "tests/$name.mjs" > /tmp/world-single.log 2>&1 || { state=failure; result=1; }
            fi
            cat /tmp/world-single.log
            if [ "${{ github.event_name }}" = push ]; then
              jq -n --arg state "$state" --arg context "physics/test-$name" '{state:$state,context:$context,description:"Direct player and world Node regression"}' > /tmp/world-single-status.json
              curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" --data-binary @/tmp/world-single-status.json "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"
            fi
          done
          exit "$result"
      - name: Report physics and real-world Node regression
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ steps.physicsworld.outcome }}
        run: |
          state=failure
          [ "$RESULT" = success ] && state=success
          jq -n --arg state "$state" '{state:$state,context:"physics/world-t1",description:"Player physics, performance, Kael and lab Node regression"}' > /tmp/physics-world-status.json
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" --data-binary @/tmp/physics-world-status.json "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"
      - run: node tools/verify.mjs build core clothing world

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright pngjs three
      - run: npx playwright install --with-deps chromium
      - name: Kael and motion-lab browser regression
        id: physicsbrowser
        run: |
          node tests/world-collision-browser.mjs
          node tests/world-playability.mjs
      - name: Report physics browser regression
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ steps.physicsbrowser.outcome }}
        run: |
          state=failure
          [ "$RESULT" = success ] && state=success
          jq -n --arg state "$state" '{state:$state,context:"physics/browser-t1",description:"Kael and lab Chromium world-playability"}' > /tmp/physics-browser-status.json
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" --data-binary @/tmp/physics-browser-status.json "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"
      - run: node tools/verify.mjs browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sernbeld-browser-evidence
          path: test-results/
          if-no-files-found: ignore

  package:
    if: github.ref == 'refs/heads/main'
    needs: [contracts, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage the verified tree
        run: |
          mkdir /tmp/sernbeld-site
          git archive HEAD | tar -xf - -C /tmp/sernbeld-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/sernbeld-site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish verified Pages artifact
        id: publish
        uses: actions/deploy-pages@v4
