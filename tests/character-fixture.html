<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Female character skin regression fixture</title>
<style>html,body{margin:0;background:#f4f2ef}canvas{display:block;width:640px;height:800px}</style></head>
<body><canvas id="view" width="640" height="800"></canvas>
<script type="module">
  import * as THREE from '../node_modules/three/build/three.module.js';
  import {loadRegisteredCharacter,DEFAULT_CHARACTER_SKIN} from '../src/entities/character/registry.js';
  try {
    const canvas=document.getElementById('view');
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
    renderer.setPixelRatio(1);
    renderer.setSize(640,800,false);
    renderer.setClearColor(0xf4f2ef);
    const scene=new THREE.Scene();
    const camera=new THREE.OrthographicCamera(-0.75,0.75,0.94,-0.94,0.05,10);
    camera.position.set(0,0,3);camera.lookAt(0,0,0);
    const character=await loadRegisteredCharacter(THREE);
    scene.add(character.group);
    renderer.render(scene,camera);
    const firstDraw={calls:renderer.info.render.calls,triangles:renderer.info.render.triangles};
    character.setPose({head:[20,0],upper_arm_left:[25,0]});
    renderer.render(scene,camera);
    const gl=renderer.getContext(),pixels=new Uint8Array(640*800*4);
    gl.readPixels(0,0,640,800,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
    let skinPixels=0;
    for(let i=0;i<pixels.length;i+=4) {
      if(pixels[i]>140 && pixels[i+1]>95 && pixels[i+2]>80 &&
         pixels[i]>pixels[i+1]+10 && pixels[i+1]>pixels[i+2]+1) skinPixels++;
    }
    window.characterFixture={ready:true,firstDraw,
      posedDraw:{calls:renderer.info.render.calls,triangles:renderer.info.render.triangles},
      skinPixels,parts:character.group.children.length,skinId:DEFAULT_CHARACTER_SKIN};
  } catch(error) {
    window.characterFixture={ready:false,error:String(error),stack:String(error.stack)};
    console.error(error);
  }
</script></body></html>
